[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docquery"
version = "1.0.0"
description = "Retrieval-augmented document Q&A with scikit-learn TF-IDF retrieval, FastAPI and a CLI."
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
docquery = "app.cli:cli"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
